# Benchmark settings: archived ACE runs, origin/idea4 data adapters.
task: formula
model: Qwen/Qwen3-4B-Instruct-2507
max_tokens: 4096
seed: 42
num_epochs: 1
eval_steps: 100
save_steps: 50
workers: 20
playbook_token_budget: 80000
# New method settings (not legacy ACE reflection-round settings).
update_every: 25
max_candidates: 2
replay_size: 16
timeout_seconds: 300
# Total readable persistent state, including rollback and best checkpoint.
memory_token_budget: 32000
knowledge_token_budget: 4000
evidence_token_budget: 16000
confirmation_examples: 8
# MCE-derived outer loop: evolve a learning skill, executed by the base-agent.
skill_token_budget: 800
skill_evolve_every: 50
skill_history_size: 2
